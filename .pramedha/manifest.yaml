# ============================================================================
# Career Template Manifest — Machine-Readable Metadata
# ============================================================================
# This file enables tools and AI assistants to:
#   - Auto-detect career repos (look for .pramedha/manifest.yaml)
#   - Validate template structure
#   - Track schema compatibility
#   - Report fill status
#
# This template is FULLY STANDALONE. No external tools are required.
# The schema mappings below are for optional integration with compatible tools.
# ============================================================================

template:
  name: "Career Operating System Template"
  version: "2.0.0"
  schema_version: "1.0.0"               # Internal schema version

# File registry — which files are required, optional, or generated
files:
  required:
    - path: "config.yaml"
      category: "config"
    - path: "identity/identity.yaml"
      category: "identity"
    - path: "identity/experience.yaml"
      category: "identity"
    - path: "identity/skills.yaml"
      category: "identity"
    - path: "identity/credentials.yaml"
      category: "identity"
    - path: "identity/projects.yaml"
      category: "identity"
    - path: "identity/claims-and-evidence.md"
      category: "identity"
    - path: "identity/professional-summary.md"
      category: "identity"
    - path: "resume/master.yaml"
      category: "resume"
    - path: "resume/design.yaml"
      category: "resume"

  optional:
    - path: "identity/volunteering.yaml"
      category: "identity"
    - path: "identity/references.yaml"
      category: "identity"
    - path: "identity/speaking-and-community.yaml"
      category: "identity"
    - path: "personal/about-me.md"
      category: "personal"
    - path: "personal/life-goals.md"
      category: "personal"
    - path: "personal/preferences.yaml"
      category: "personal"
    - path: "strategy/target-roles.md"
      category: "strategy"
    - path: "strategy/master-action-tracker.md"
      category: "strategy"
    - path: "strategy/digital-presence-plan.md"
      category: "strategy"
    - path: "strategy/role-analysis.md"
      category: "strategy"
    - path: "assets/platform-copy.md"
      category: "assets"
    - path: "ops/session-handoff.md"
      category: "ops"
    - path: "ops/conversation-context-archive.md"
      category: "ops"
    - path: "journal/wins.md"
      category: "journal"
    - path: "journal/learning-log.md"
      category: "journal"

  generated:
    - path: "resume/generated/*.yaml"
      note: "Auto-assembled by assemble.py — DO NOT EDIT"
    - path: "resume/output/*.pdf"
      note: "Rendered PDFs — DO NOT COMMIT"

# Tools
tools:
  cascade_engine: "resume/assemble.py"
  validator: ".pramedha/validate.py"
  build_script_windows: "resume/build.ps1"
  build_script_unix: "resume/build.sh"
