# ============================================================================
# Pramedha Career Template Manifest — Machine-Readable Metadata
# ============================================================================
# This file enables tools and AI assistants to:
#   - Auto-detect career repos (look for .pramedha/manifest.yaml)
#   - Validate template structure
#   - Track schema compatibility
#   - Report fill status
#
# This template is FULLY STANDALONE. No external tools are required.
# The schema mappings below are for optional integration with compatible tools.
# ============================================================================

template:
  name: "Pramedha Career Template"
  version: "0.1.0"
  schema_version: "0.1.0"
  standalone: true                        # Works without any external tools
  pramedha_compatible: true               # Also works with the Pramedha platform

# File registry — which files are required, optional, or generated
files:
  required:
    - path: "config.yaml"
      category: "config"
    - path: "identity/identity.yaml"
      category: "identity"
    - path: "identity/experience.yaml"
      category: "identity"
    - path: "identity/skills.yaml"
      category: "identity"
    - path: "identity/credentials.yaml"
      category: "identity"
    - path: "identity/projects.yaml"
      category: "identity"
    - path: "identity/claims-and-evidence.md"
      category: "identity"
    - path: "identity/professional-summary.md"
      category: "identity"
    - path: "resume/master.yaml"
      category: "resume"
    - path: "resume/design.yaml"
      category: "resume"
    - path: "resume/assemble.py"
      category: "resume"
    - path: "resume/sync.py"
      category: "resume"

  optional:
    - path: "identity/volunteering.yaml"
      category: "identity"
    - path: "identity/references.yaml"
      category: "identity"
    - path: "identity/speaking-and-community.yaml"
      category: "identity"
    - path: "personal/about-me.md"
      category: "personal"
    - path: "personal/life-goals.md"
      category: "personal"
    - path: "personal/preferences.yaml"
      category: "personal"
    - path: "personal/career-narrative.md"
      category: "personal"
    - path: "personal/reflections.md"
      category: "personal"
    - path: "strategy/target-roles.md"
      category: "strategy"
    - path: "strategy/master-action-tracker.md"
      category: "strategy"
    - path: "strategy/digital-presence-plan.md"
      category: "strategy"
    - path: "strategy/role-analysis.md"
      category: "strategy"
    - path: "strategy/study-plan.md"
      category: "strategy"
    - path: "strategy/financial.md"
      category: "strategy"
    - path: "strategy/content-plan.md"
      category: "strategy"
    - path: "strategy/risk-register.md"
      category: "strategy"
    - path: "strategy/networking.md"
      category: "strategy"
    - path: "strategy/offer-comparison.md"
      category: "strategy"
    - path: "strategy/weekly-tracker.md"
      category: "strategy"
    - path: "assets/star-stories.md"
      category: "assets"
    - path: "assets/interview-prep/behavioral.md"
      category: "assets"
    - path: "assets/interview-prep/technical.md"
      category: "assets"
    - path: "assets/linkedin-pack.md"
      category: "assets"
    - path: "assets/github-readme.md"
      category: "assets"
    - path: "assets/questions-to-ask.md"
      category: "assets"
    - path: "assets/form-fill-cheatsheet.md"
      category: "assets"
    - path: "assets/testimonials.md"
      category: "assets"
    - path: "assets/platform-copy.md"
      category: "assets"
    - path: "ops/session-handoff.md"
      category: "ops"
    - path: "ops/guide.md"
      category: "ops"
    - path: "ops/authority-map.md"
      category: "ops"
    - path: "ops/prompts.md"
      category: "ops"
    - path: "ops/audit-checklist.md"
      category: "ops"
    - path: "journal/wins.md"
      category: "journal"
    - path: "journal/learning-log.md"
      category: "journal"
    - path: "journal/feedback.md"
      category: "journal"

  generated:
    - path: "resume/generated/*.yaml"
      note: "Auto-assembled by assemble.py — DO NOT EDIT"
    - path: "resume/output/*.pdf"
      note: "Rendered PDFs — DO NOT COMMIT"

# Tools
tools:
  cascade_engine: "resume/assemble.py"
  bridge_sync: "resume/sync.py"
  validator: ".pramedha/validate.py"
  build_script_windows: "resume/build.ps1"
  build_script_unix: "resume/build.sh"
