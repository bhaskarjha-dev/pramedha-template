# ============================================================================
# Pramedha Career Template Manifest — Machine-Readable Metadata
# ============================================================================
# This file enables tools and AI assistants to:
#   - Auto-detect career repos (look for .pramedha/manifest.yaml)
#   - Validate template structure
#   - Track schema compatibility
#   - Report fill status
#
# This template is FULLY STANDALONE. No external tools are required.
# The schema mappings below are for optional integration with compatible tools.
# ============================================================================

template:
  name: "Pramedha Career Template"
  version: "0.1.0"
  schema_version: "0.1.0"
  standalone: true                        # Works without any external tools
  pramedha_compatible: true               # Also works with the Pramedha platform

# Paths the template owns. tools/update_template.py replaces exactly these from the upstream template.
# Everything else (your data, config.yaml, VISION.md, AGENTS.md, .gitignore, tools/resume/master.yaml,
# design.yaml, your variants) is never touched by an update.
template_owned:
  - .github/workflows/validate.yml
  - .github/CHANGELOG.md
  - .github/CONTRIBUTING.md
  - .pramedha/agent-instructions.md
  - .pramedha/examples
  - .pramedha/import-guide.md
  - .pramedha/manifest.yaml
  - .pramedha/schema-reference.md
  - .pramedha/tests
  - .pramedha/validate.py
  - GETTING_STARTED.md
  - LICENSE
  - README.md
  - ROADMAP.md
  - data-corpus/README.md
  - data-corpus/documents/README.md
  - data-corpus/exports/README.md
  - data-corpus/github/README.md
  - data-corpus/linkedin/README.md
  - data-corpus/media/README.md
  - data-corpus/resumes/README.md
  - data-corpus/text/README.md
  - docs
  - ops/authority-map.md
  - ops/guide.md
  - ops/prompts.md
  - pytest.ini
  - tests
  - tools/external/README.md
  - tools/resume/README.md
  - tools/resume/_yaml_utils.py
  - tools/resume/assemble.py
  - tools/resume/build.ps1
  - tools/resume/build.sh
  - tools/resume/jd/_template.yaml
  - tools/resume/requirements.txt
  - tools/resume/sync.py
  - tools/resume/tests
  - tools/resume/variants/_template.yaml
  - tools/update_template.py

# File registry — which files are required, optional, or generated
files:
  required:
    - path: "config.yaml"
      category: "config"
    - path: "identity/identity.yaml"
      category: "identity"
    - path: "identity/experience.yaml"
      category: "identity"
    - path: "identity/skills.yaml"
      category: "identity"
    - path: "identity/credentials.yaml"
      category: "identity"
    - path: "identity/projects.yaml"
      category: "identity"
    - path: "identity/claims-and-evidence.md"
      category: "identity"
    - path: "identity/professional-summary.md"
      category: "identity"
    - path: ".pramedha/manifest.yaml"
      category: "system"

  satellites:
    - path: "tools/resume/master.yaml"
      category: "resume"
      description: "On-demand master bullet pool forward-projected from identity/ via sync.py"
    - path: "tools/resume/design.yaml"
      category: "resume"
      description: "RenderCV design configuration"
    - path: "tools/resume/assemble.py"
      category: "resume"
      description: "Resume cascade engine"
    - path: "tools/resume/sync.py"
      category: "resume"
      description: "Forward bridge from identity/ to master.yaml"
    - path: "tools/resume/_yaml_utils.py"
      category: "resume"
      description: "YAML helpers for bullet cascade"
    - path: "tools/resume/build.ps1"
      category: "resume"
      description: "PowerShell build script"
    - path: "tools/resume/build.sh"
      category: "resume"
      description: "Shell build script"

  optional:
    - path: "identity/volunteering.yaml"
      category: "identity"
    - path: "identity/references.yaml"
      category: "identity"
    - path: "identity/speaking-and-community.yaml"
      category: "identity"
    - path: "personal/about-me.md"
      category: "personal"
    - path: "personal/life-goals.md"
      category: "personal"
    - path: "personal/preferences.yaml"
      category: "personal"
    - path: "personal/career-narrative.md"
      category: "personal"
    - path: "personal/reflections.md"
      category: "personal"
    - path: "personal/form-fill-cheatsheet.md"
      category: "personal"
    - path: "stories/star-stories.md"
      category: "stories"
    - path: "stories/testimonials.md"
      category: "stories"
    - path: "stories/interview-prep/behavioral.md"
      category: "stories"
    - path: "stories/interview-prep/technical.md"
      category: "stories"
    - path: "strategy/target-roles.md"
      category: "strategy"
    - path: "strategy/study-plan.md"
      category: "strategy"
    - path: "strategy/financial.md"
      category: "strategy"
    - path: "strategy/job-tracker.md"
      category: "strategy"
    - path: "strategy/networking.md"
      category: "strategy"
    - path: "strategy/offer-comparison.md"
      category: "strategy"
    - path: "journal/wins.md"
      category: "journal"
    - path: "journal/learning-log.md"
      category: "journal"
    - path: "journal/feedback.md"
      category: "journal"
    - path: "ops/session-handoff.md"
      category: "ops"
    - path: "ops/guide.md"
      category: "ops"
    - path: "ops/authority-map.md"
      category: "ops"
    - path: "ops/prompts.md"
      category: "ops"

  generated:
    - path: "tools/resume/generated/*.yaml"
      note: "Auto-assembled by assemble.py — DO NOT EDIT"
    - path: "tools/resume/output/*.pdf"
      note: "Rendered PDFs — DO NOT COMMIT"

# Tools
tools:
  cascade_engine: "tools/resume/assemble.py"
  bridge_sync: "tools/resume/sync.py"
  yaml_utils: "tools/resume/_yaml_utils.py"
  validator: ".pramedha/validate.py"
  build_script_windows: "tools/resume/build.ps1"
  build_script_unix: "tools/resume/build.sh"
