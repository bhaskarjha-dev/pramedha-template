# ============================================================================
# EXPERIENCE — Employment History & Project Details
# ============================================================================
# Maps to: PramedhaProfile.professional.experience[]
# Schema: pramedha.models.ExperienceEntry[]
# Docs: .pramedha/schema-reference.md#experience
#
# Structure: employer → projects → deliverables → bullets
# Each bullet should be a single, measurable achievement.
# Use the verification tags on every claim.
#
# Verification Legend:
#   ✅ VERIFIED   — Evidence exists
#   ⚠️ ESTIMATED  — Reasonable but unverified
#   ❌ UNVERIFIED — Aspiration or uncertain
#
# Tips:
#   - List employers in reverse chronological order (newest first)
#   - Each bullet: "Action verb + what you did + measurable impact"
#   - Tag metrics: [measured] = from real data, [estimated] = reasonable guess
#   - The `skills` list per deliverable feeds your skills.yaml auto-population
# ============================================================================

experience:
  # ────────────────────────────────────────────────────────────────────────
  # EMPLOYER 1 (Most Recent)
  # ────────────────────────────────────────────────────────────────────────
  - company: ""
    position: ""                  # Official job title / position
    role_subtitle: ""             # Functional role (if different from position)
    start_date: ""                # YYYY-MM format
    end_date: "present"           # YYYY-MM or "present"
    location: ""                  # City, State
    employment_type: ""           # full_time | part_time | contract | internship | freelance
    industry: ""                  # e.g., "Fintech", "Healthcare", "EdTech", "E-commerce"
    team_size: 0                  # Size of your team / org
    reporting_to: ""              # Title of your manager (shows your level)
    verification: ""              # e.g., "✅ VERIFIED — offer letter on file"

    projects:
      - name: ""
        client: ""                # Client name (if consulting/services)
        period: ""                # e.g., "Jan 2025 – Present"
        verification: ""

        deliverables:
          - name: ""
            period: ""
            verification: ""
            description: >
              One paragraph describing what this deliverable was about.
              Context, problem, your role.
            bullets:
              - ""                # "Action verb + what + measurable impact"
              - ""
            skills: []            # Technologies/tools used

      # Uncomment and fill for more projects:
      # - name: ""
      #   client: ""
      #   period: ""
      #   deliverables:
      #     - name: ""
      #       bullets:
      #         - ""

  # ────────────────────────────────────────────────────────────────────────
  # EMPLOYER 2
  # ────────────────────────────────────────────────────────────────────────
  # - company: ""
  #   position: ""
  #   start_date: ""
  #   end_date: ""
  #   location: ""
  #   industry: ""
  #   team_size: 0
  #   projects:
  #     - name: ""
  #       deliverables:
  #         - name: ""
  #           bullets:
  #             - ""

# ─── Career Breaks / Transitions (Optional) ─────────────────────────────────
# Documenting significant career pauses (parental leave, caregiving, health,
# sabbatical, full-time study, job search) prevents resume gaps from confusing ATS
# and provides AI the context to articulate purposeful transition narratives.
career_breaks: []
  # - type: "sabbatical"           # sabbatical | caregiving | parental_leave | education | health | relocation | career_transition
  #   start_date: "2024-01"
  #   end_date: "2024-06"
  #   title: "Professional Sabbatical & Independent Study"
  #   description: "Intensive independent study in GenAI system architecture; completed 2 production open-source tools"
  #   skills_acquired: ["PyTorch", "vLLM", "RAG Architecture"]
  #   verification: "✅ VERIFIED — GitHub public repositories"

# ─── Non-Linear / Freelance / Academic Guidance ──────────────────────────────
# For Freelancers / Agency / Portfolio careers:
#   Set `company` to your brand or "Independent Consulting / Self-Employed".
#   Each client engagement is a `project`, with `client`, `deliverables`, and metrics.
# For Academics / Researchers:
#   Set `company` to University/Institute, `projects` to research labs/grants,
#   and `deliverables` to papers/trials/theses.

# ─── Metadata & Maintenance ─────────────────────────────────────────────────
last_updated: ""                  # YYYY-MM-DD — updated during quarterly audit
