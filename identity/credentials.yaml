# ============================================================================
# CREDENTIALS — Education, Certifications, Awards, Test Scores
# ============================================================================
# Maps to: PramedhaProfile.professional.education[]
#          PramedhaProfile.professional.certifications[]
#          PramedhaProfile.professional.awards[]
#          PramedhaProfile.professional.test_scores[]
#          PramedhaProfile.professional.publications[]
#          PramedhaProfile.professional.patents[]
#          PramedhaProfile.professional.grants[]
# Schema: pramedha.models.EducationEntry[], CertificationEntry[], AwardEntry[], TestScoreEntry[], PublicationEntry[], PatentEntry[], GrantEntry[]
# Docs: .pramedha/schema-reference.md#credentials
#
# Verification Legend:
#   ✅ VERIFIED   — Certificate/document exists in data-corpus/documents/
#   ⚠️ ESTIMATED  — Score approximate, need to verify
#   ❌ UNVERIFIED — Not yet confirmed
# ============================================================================

# ─── Education ───────────────────────────────────────────────────────────
education:
  - degree: ""                # e.g., "B.S.", "B.Tech", "B.A.", "M.Sc.", "MBA", "MD", "PhD"
    field: ""                 # e.g., "Computer Science", "Mechanical Engineering", "Economics"
    institution: ""
    university: ""            # If different from institution
    start_date: ""            # YYYY-MM or YYYY (e.g., "2018")
    end_date: ""              # YYYY-MM, YYYY, or "present" (e.g., "2022")
    year: 0                   # Graduation year (optional / fallback for end_date)
    score: ""                 # GPA, CGPA, honors, percentage (e.g., "3.8/4.0", "8.5/10")
    honors: []                # e.g., ["Cum Laude", "Dean's List"]
    courses: []               # Relevant coursework
    verification: ""

  # - degree: ""
  #   field: ""
  #   institution: ""
  #   start_date: ""
  #   end_date: ""
  #   year: 0
  #   score: ""

# ─── Certifications ─────────────────────────────────────────────────────
certifications:
