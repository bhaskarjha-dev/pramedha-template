# ============================================================================
# PROJECTS — Portfolio Projects
# ============================================================================
# Maps to: PramedhaProfile.professional.projects[]
# Schema: pramedha.models.ProjectEntry[]
# Docs: .pramedha/schema-reference.md#projects
#
# Include both public (GitHub, live demos) and internal/professional projects.
# Each project should demonstrate skills relevant to your target roles.
#
# Tips:
#   - Lead with the problem solved, not the tech used
#   - Include measurable outcomes where possible
#   - Link to live demos, GitHub repos, or screenshots
#   - Technologies list feeds skill auto-detection
#
# Resume Cascade Mapping:
#   - Projects sync to tools/resume/master.yaml under `projects:` (via tools/resume/sync.py or manual edit)
#   - In tools/resume/master.yaml, each project has a snake_case key:
#       name: matches project name
#       date: start_date – end_date (or year)
#       location: repo or live_url
#       bullets: { default: "...", technical: "..." } derived from highlights
# ============================================================================

# ─── Public Projects (open source, personal, visible) ────────────────────
public:
  # Realistic Example (uncomment and adapt):
  # - name: "DocQuery AI"
  #   tagline: "Local document search agent using RAG and vector embeddings"
  #   status: "active"
  #   role: "Creator & Maintainer"
  #   team_size: 1
  #   start_date: "2024-02"
  #   end_date: "present"
  #   repo: "https://github.com/example/docquery-ai"
  #   live_url: "https://docquery-demo.com"
  #   tech: ["Python", "FastAPI", "Qdrant", "Ollama", "Docker"]
  #   highlights:
  #     - "Built hybrid semantic search engine over 50,000 documents with sub-200ms query latency [measured]"
  #     - "Accumulated 1,200 GitHub stars and 4,000 monthly active users [measured]"
  #   impact_metrics: "1.2k stars, 4k MAU, sub-200ms latency"
  #   license: "MIT"
  #   verification: "✅ VERIFIED — public GitHub repo & live URL"
  #   relevance: ["Senior Backend Engineer", "AI/ML Engineer"]

  # - name: ""
  #   tagline: ""               # One-line description
  #   status: ""                # active | completed | archived | paused
  #   role: ""                  # e.g., "Solo developer", "Team lead", "Contributor"
  #   team_size: 1              # 1 = solo, 5 = small team, etc.
  #   start_date: ""            # YYYY-MM
  #   end_date: ""              # YYYY-MM or "present"
  #   repo: ""                  # Code repository URL (for technical / open-source projects)
  #   live_url: ""              # Live demo, portfolio piece, case study, or report URL
  #   tech: []                  # Tools, technologies, frameworks, or methodologies used
  #   highlights:
  #     - ""                    # Key achievement/feature
  #     - ""
  #   impact_metrics: ""        # e.g., "500 stars, 2K downloads/month", "$200K saved", "45% faster"
  #   license: ""               # e.g., "MIT", "Apache-2.0", "Proprietary"
  #   verification: ""
  #   relevance: []             # Which target roles this supports

# ─── Internal/Professional Projects ──────────────────────────────────────
# Projects done at work that can't be open-sourced but can be described.
internal:
