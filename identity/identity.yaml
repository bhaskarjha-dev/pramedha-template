# ============================================================================
# IDENTITY — Core Personal, Contact & Extended Demographic Information
# ============================================================================
# Maps to: PramedhaProfile.professional.identity
# Schema: pramedha.models.ProfessionalIdentity
# Docs: .pramedha/schema-reference.md#config-identity
#
# SOURCE OF TRUTH & AUTHORITY:
# - This file defines your core identity, demographics, and work authorization.
# - Contact info (name, email, phone, location, profiles) can be defined here
#   or in config.yaml.
# - Priority: master.yaml > identity/identity.yaml > config.yaml
#   If contact fields are omitted here, tools/resume/assemble.py automatically falls
#   back to config.yaml.
#
# Verification Legend:
#   ✅ VERIFIED   — Evidence exists (cert, screenshot, official doc)
#   ⚠️ ESTIMATED  — Reasonable but unverified
#   ❌ UNVERIFIED — Aspiration or uncertain
# ============================================================================

# ─── Contact & Profile (Optional override; defaults to ../config.yaml) ──────
# If defined here, values take precedence over config.yaml during assembly.
# Leave blank/commented to use config.yaml as the single source.
# name: ""
# email: ""
# phone: ""
# website: ""
# location:
#   city: ""
#   region: ""
#   country_code: ""
# profiles:
#   linkedin: ""
#   github: ""
#   twitter: ""

# ─── Demographics (not in config.yaml) ───────────────────────────────────
pronouns: ""                    # e.g., "he/him", "she/her", "they/them"
date_of_birth: ""               # YYYY-MM-DD (optional, some applications require)
nationality: ""                 #                            # VERIFICATION_TAG

# ─── Work Authorization ──────────────────────────────────────────────────
work_authorization:
  status: ""                    # citizen | permanent_resident | work_visa | need_sponsorship
  countries: []                 # Countries where you're authorized to work
  visa_details: ""              # e.g., "H-1B valid until 2027", "OCI cardholder"
  verification: ""

# ─── Languages ───────────────────────────────────────────────────────────
languages:
  - language: ""
    level: ""                   # native | fluent | professional | conversational | elementary
  # - language: ""
  #   level: ""

# ─── Years of Experience ─────────────────────────────────────────────────
# Quick reference. Computed from experience.yaml but useful for filtering.
total_years_experience: 0       # Total professional experience
years_in_current_role: 0

# ─── Headline (extended version) ─────────────────────────────────────────
# config.yaml has a short headline. This is the full professional identity.
professional_headline: ""       # e.g., "Senior Backend Engineer specializing in
                                # distributed systems and GenAI, with 5 years
                                # building high-scale platforms at Fortune 500s"

# ─── Metadata & Maintenance ─────────────────────────────────────────────────
last_updated: ""                # YYYY-MM-DD — updated during quarterly audit
