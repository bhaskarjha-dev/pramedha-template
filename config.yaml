# ============================================================================
# PRAMEDHA TEMPLATE — User Configuration
# ============================================================================
# Fill this FIRST. Everything else builds on this.
#
# This file tells AI assistants and the resume cascade engine who you are.
# If using the Pramedha platform, this file initializes your profile.
# ============================================================================

schema_version: "0.1.0"

# ─── Pramedha Format Specification ──────────────────────────────────────────
pramedha_format:
  version: "1.0.0"
  compatible_with: "pramedha >= 0.1.0"
  description: "Pramedha portable career format — YAML/Markdown flat files"

# ─── Your Identity ───────────────────────────────────────────────────────────
user:
  name: ""                    # Full name (as it appears on resume)
  email: ""                   # Primary professional email
  phone: ""                   # With country code, e.g., "+1-555-0100" or "+XX-XXXXXXXXXX"
  website: ""                 # Personal website URL (if any)
  headline: ""                # One-line professional headline
                              # e.g., "Senior Backend Engineer | GenAI Specialist"

# ─── Profession & Career Type ────────────────────────────────────────────────
# This shapes how AI fills your template — which fields to prioritize,
# what resume format to suggest, which portfolio style to recommend.
#
# profession_type options: engineering | creative | medical | business | academic
#                          legal | freelance | executive | other
profession_type: ""

# career_type options: employed | freelance | portfolio | academic | military | government | student
# Shapes experience hierarchy (e.g. employers vs clients vs research grants).
career_type: "employed"

# Target role level (non-sensitive reference for AI positioning):
# intern | entry | junior | mid | senior | lead | staff | principal | director | vp | c-level | executive
target_role_level: ""

# ─── Location ────────────────────────────────────────────────────────────────
location:
  city: ""
  region: ""                  # State/province
  country_code: ""            # ISO 3166-1 alpha-2 (e.g., "IN", "US", "GB")
  willing_to_relocate: false
  preferred_locations: []     # e.g., ["Bangalore", "Remote", "San Francisco"]

# ─── Online Presence ─────────────────────────────────────────────────────────
profiles:
  linkedin: ""                # Full URL
  github: ""                  # Full URL
  twitter: ""                 # Full URL (optional)
  portfolio: ""               # Portfolio/blog URL (optional)
  # Add more as needed:
  # dribbble: ""              # For designers
  # scholar: ""               # For academics (Google Scholar)
  # orcid: ""                 # For researchers

# ─── Locale, Dates & Internationalization ───────────────────────────────────
locale: "en"                  # Language code (en, hi, de, ja, fr, etc.)
                              # All files are UTF-8 encoded. Non-Latin scripts (Devanagari, CJK, Arabic)
                              # are fully supported. Note: character limits (e.g. LinkedIn 220 chars)
                              # are enforced in Unicode characters.
currency: "USD"               # ISO 4217 currency code (USD, EUR, GBP, INR, CAD, AUD, etc.)
date_format: "YYYY-MM"        # How dates appear in YAML files

# ─── Metadata & Maintenance ─────────────────────────────────────────────────
last_updated: ""              # YYYY-MM-DD — updated during quarterly audit

# ─── Career & Financial Context (Privacy Notice) ─────────────────────────────
# ⚠️ PRIVACY: Specific financial numbers (current salary, target range, floor)
# and personal constraints live in personal/preferences.yaml (private) and
# strategy/financial.md (private). Keep sensitive compensation figures there
# so this config file remains safe if shared.
