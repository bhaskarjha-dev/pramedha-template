# ============================================================================
# VARIANT TEMPLATE — Copy this file to create a new resume variant
# ============================================================================
# Filename convention: descriptive_name.yaml (e.g., genai_engineer.yaml)
#
# This file selects bullets FROM master.yaml for a specific target role.
# It does NOT contain bullet text — only references to master.yaml keys.
# ============================================================================

variant_name: "General"              # e.g., "Senior Backend Engineer", "GenAI Specialist"
output_filename: ""                   # Optional plain file name (letters, digits, . _ -). Blank = {Your_Name}_{variant_name}_CV

# ─── Summary (specific to this variant) ──────────────────────────────────
summary: ""                           # 2-3 lines tailored to this role, from verified facts. Empty = no summary

# ─── Experience Selection ────────────────────────────────────────────────
# Format: role_key → list of [bullet_key, phrasing] pairs
# If phrasing omitted, "default" is used.
experience:
  # role_key_from_master:
  #   - [bullet_key_1, default]    # Use default phrasing
  #   - [bullet_key_2, technical]  # Use technical phrasing
  #   - [bullet_key_3]             # Shorthand for [key, default]

# ─── Projects Selection ──────────────────────────────────────────────────
# Supports single string key, phrasing tuple, multi-bullet list, or explicit dict:
#   - project_key                        # Uses 'default' bullet phrasing
#   - [project_key, technical]           # Uses specific bullet phrasing
#   - [project_key, [default, technical]]# Uses multiple bullet highlights
#   - project: project_key               # Dict syntax
#     bullets: [default, technical]
projects: []
  # - project_key_from_master
  # - [another_project_key, technical]

# ─── Technologies (override master if needed) ────────────────────────────
technologies: []
  # - label: "GenAI"
  #   details: "RAG, LLM APIs, LangChain, Vector DBs"
  # - label: "Backend"
  #   details: "Python, FastAPI, PostgreSQL"

# ─── Education (override master if needed) ───────────────────────────────
# education: []
#   # - institution: "University Name"
#   #   area: "Computer Science"
#   #   degree: "B.Tech"
#   #   start_date: "2018"
#   #   end_date: "2022"
#   #   highlights:
#   #     - "CGPA: 8.5/10"

# ─── Achievements Selection ──────────────────────────────────────────────
achievements: []
  # - achievement_key_from_master
